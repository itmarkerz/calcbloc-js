name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # vitest 4 needs Node 20+; on Node 18 the built package is still checked by test:dist below.
      - run: npm test
        if: matrix.node != 18
      - run: npm run build
      - run: npm run test:dist
      - run: npm pack --dry-run

  # Publish to npm with provenance when a GitHub release is published.
